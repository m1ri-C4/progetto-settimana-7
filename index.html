<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsHub</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script type="module" src="./assets/js/script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>

<body>
    <header class="container-fluid bg-primary text-light">
        <div class="text-center justify-content-center py-5">
            <h1>SportsHub</h1>
            <p class="text-white-50">Cerca una squadra, scopri prossime partite e ultimi risultati.</p>

            <div class="row justify-content-center">
                <div class="col-12 col-md-9 col-lg-6">

                    <form class="d-flex gap-2" role="search">
                        <input id="search" class="form-control" type="search"
                            placeholder="Es. Arsenal, Lakers, Real Madrid..." aria-label="Cerca">
                        <button class="btn btn-light text-primary-emphasis fw-bold" type="submit"> Cerca </button>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="my-4">
            <h2>⭐ Le tue squadre preferite</h2>
            <p id="emptyFavourites" class="text-muted"> <i>Non hai ancora salvato nessuna squadra. Cercane una qui sopra e aggiungila ai preferiti.</i> </p>
            <div id="favourite" class="row g-3 mt-3"></div>
        </section>

        <section class="my-4">
            <h2>Squadre trovate</h2>
            <p id="emptyTeams" class="text-muted"> <i>Inizia cercando una squadra sopra.</i> </p>
            <div id="teams" class="row g-3 mt-3"></div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
        integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
        crossorigin="anonymous"></script>
</body>

</html>
